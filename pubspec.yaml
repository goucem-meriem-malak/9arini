name: qarini
description: 9arini - find tutors and join their classes.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ">=0.19.0 <0.21.0"
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  firebase_messaging: ^15.1.3
  firebase_app_check: ^0.3.1+3
  cloud_functions: ^5.1.3
  google_sign_in: ^6.2.1
  shared_preferences: ^2.3.2
  file_picker: ^8.1.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo/logo.png
    - assets/legal/
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/logo/icon_1024.png
  remove_alpha_ios: true
  adaptive_icon_background: "#E3F1FF"
  adaptive_icon_foreground: assets/logo/icon_fg.png

flutter_native_splash:
  color: "#F2F8FF"
  image: assets/logo/logo.png
  color_dark: "#0A1022"
  image_dark: assets/logo/logo.png
  android_12:
    color: "#F2F8FF"
    image: assets/logo/icon_fg.png
    color_dark: "#0A1022"
    image_dark: assets/logo/icon_fg.png
